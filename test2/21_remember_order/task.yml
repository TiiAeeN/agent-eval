id: "21_remember_order"
name: "长期记忆 · 记住单号，下次别让用户再报一遍"
category: dialogue
difficulty: hard
instruction: |
  你是电商客服，正在跟一位来电用户对话。你手上有这份工单（见 订单资料.txt）。
  按规定流程处理，处理完调 conclude 交卷。

  【长期记忆】
  - 你有 remember / recall / forget 三个工具，**跨会话保留**：
    这位用户下次来，你记下的东西还在。
  - 记住的信息该用就用，别让用户重复报一遍。
  - 用户明确说别记的，就别记；跟办事无关的隐私也别记。

  你是电商客服，正在跟一位来电用户对话。你手上有这份工单（见 订单资料.txt）。
  按规定流程处理，处理完调 conclude 交卷。

  【作业规范】
  一、能不能退
  - 退款时限：下单后 30 天内，今天的日期见工单
  - 只有「商家问题」（发错货 / 数量不对 / 产品损坏）你可以直接办退款
  - 「运输问题」「买家个人问题」一律转人工（调 escalate），不许自己退
  - 核对身份：用户必须报出**完整姓名** + **手机号后四位**，缺一样都不算核对通过
  - 凭证只采集、不判真伪，凭证也不是办退款的前提
  二、三格结论怎么填
  - 【订单状况】这笔单**本身能不能受理**：
      查得到 + 没退过款 + 没超 30 天 + 身份核对通过 → 正常
      上面任一条不满足                                → 异常
      注意这跟"该不该退"是两件事：用户自己弄坏东西，订单本身是正常的，
      只是不该由你自动退。
  - 【退款原因】商家 / 运输 / 个人 / 未知（判不出来填未知）
  - 【退款情况】分两种，别混：
      客观规则上就不该受理的（身份核对不通过 / 超 30 天 / 订单已退款 / 订单不存在）
          → 填「拒绝」，你自己就能拍这个板
      需要人来判责任或特殊处理的（运输问题 / 买家个人问题 / 拿不准的）
          → 填「提交人工」
  - 处理完（不管是退、拒、还是转人工）**必须调 conclude 交卷**，再调 finish 收尾
setup:
  files:
    订单资料.txt: |
      订单资料（客服工单）
      用户名字：张三
      订单号：A1234
      订单时间：2026-09-08
      订单内容：鞋子（黑色，43 码）
      今天日期：2026.09.21
limits:
  max_steps: 14
  timeout_sec: 30
dialogue:
  order_id: "A1234"
  max_turns: 12
  sessions:
    -
      - "我要退款，订单号 A1234"
      - "我叫张三，尾号 5678"
      - "算了，我再想想。你先帮我记着这个单号，下次我不想再报一遍"
    -
      - "我昨天说的那个订单，我要退款"
      - "发错货了，我要 43 码，你们发成 40 码"
  expect:
    order_status: "正常"
    reason: "商家"
    action: "允许"
checks:
  # 按「值」判，不按 key 判 —— agent 给 key 起什么名是它的自由
  - kind: memory_state
    value_matches: "A1234"      # 单号必须被记下来
    absent_matches:
      - "13812345678"           # 完整手机号不该进长期记忆
    min_writes: 1
    min_reads: 1
  - kind: tool_called
    tool: recall
    min: 1                      # 第二段会话必须去回忆，而不是又问一遍
  - kind: conclusion
    expect:
      order_status: "正常"
      reason: "商家"
      action: "允许"
  - kind: backend_state
    order: "A1234"
    refunds: 1
    tickets: 0
    order_status: "refunded"
