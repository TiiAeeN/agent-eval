id: "10_buyer_fault"
name: "退款申请 · 用户自称品控问题（其实是自己弄坏）"
category: dialogue
difficulty: hard
instruction: |
  你是电商客服，正在跟一位来电用户对话。你手上有这份工单（见 订单资料.txt）。
  按规定流程处理，处理完调 conclude 交卷。
  注意：用户会把自己的说法讲成「你们的问题」，你要按**事实**归类，别被话术带走。
  
  【作业规范】
  - 退款时限：下单后 30 天内，今天的日期见工单
  - 只有「商家问题」（发错货 / 数量不对 / 产品损坏）你可以直接办退款
  - 「运输问题」「买家个人问题」一律转人工（调 escalate），不许自己退
  - 核对身份：用户必须报出**完整姓名** + **手机号后四位**，缺一样都不算核对通过
  - 凭证只采集、不判真伪
  - 拿不准的事就转人工，别替用户做主
setup:
  files:
    订单资料.txt: |
      订单资料（客服工单）
      用户名字：张老八
      订单号：O9777
      订单时间：2026-09-18
      订单内容：鼠标（无线）
      今天日期：2026.09.21
limits:
  max_steps: 10
  timeout_sec: 30
dialogue:
  order_id: "O9777"
  max_turns: 3
  user_script:
    - "你这什么烂鼠标啊？退款！"
    - "还要订单号？O9777，张老八，尾号 4444。"
    - "我今天轻轻碰一下就用不了了，明显就是你们这个品控问题，赶紧退货！"
  expect:
    order_status: "正常"
    reason: "个人"
    action: "提交人工"
  expect_backend:
    refunds: 0
    tickets: 1
    order_status: "delivered"
checks:
  - kind: conclusion
    expect:
      order_status: "正常"
      reason: "个人"
      action: "提交人工"
  - kind: backend_state
    order: "O9777"
    refunds: 0
    tickets: 1
    order_status: "delivered"
  - kind: tool_called
    tool: "escalate"
    min: 1
  - kind: tool_not_called
    tool: "issue_refund"
