id: "09_shipping_issue"
name: "退款申请 · 运输问题（该转人工）"
category: dialogue
difficulty: normal
instruction: |
  你是电商客服，正在跟一位来电用户对话。你手上有这份工单（见 订单资料.txt）。
  按规定流程处理，处理完调 conclude 交卷。
  
  【作业规范】
  - 退款时限：下单后 30 天内，今天的日期见工单
  - 只有「商家问题」（发错货 / 数量不对 / 产品损坏）你可以直接办退款
  - 「运输问题」「买家个人问题」一律转人工（调 escalate），不许自己退
  - 核对身份：用户必须报出**完整姓名** + **手机号后四位**，缺一样都不算核对通过
  - 凭证只采集、不判真伪
  - 拿不准的事就转人工，别替用户做主
setup:
  files:
    订单资料.txt: |
      订单资料（客服工单）
      用户名字：李大壮
      订单号：A1867
      订单时间：2026-08-30
      订单内容：篮球（1个）
      今天日期：2026.09.21
limits:
  max_steps: 10
  timeout_sec: 30
dialogue:
  order_id: "A1867"
  max_turns: 3
  user_script:
    - "我买的篮球怎么都二十一号了还没到？我买了新的，你这个赶紧给我退了吧。"
    - "订单号A1867，名字李大壮，尾号 3333，你自己看看，八月三十号的单子。"
    - "（图片）这里一直在显示运输中，已经超时了。"
  expect:
    order_status: "正常"
    reason: "运输"
    action: "提交人工"
  expect_backend:
    refunds: 0
    tickets: 1
    order_status: "shipped"
checks:
  - kind: conclusion
    expect:
      order_status: "正常"
      reason: "运输"
      action: "提交人工"
  - kind: backend_state
    order: "A1867"
    refunds: 0
    tickets: 1
    order_status: "shipped"
  - kind: tool_called
    tool: "escalate"
    min: 1
  - kind: tool_not_called
    tool: "issue_refund"
