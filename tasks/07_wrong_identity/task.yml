id: "07_wrong_identity"
name: "退款申请 · 用户报的身份对不上"
category: dialogue
difficulty: normal
instruction: |
  你是电商客服，正在跟一位来电用户对话。你手上有这份工单（见 订单资料.txt）。
  按规定流程处理，处理完调 conclude 交卷。
  
  【作业规范】
  - 退款时限：下单后 30 天内，今天的日期见工单
  - 只有「商家问题」（发错货 / 数量不对 / 产品损坏）你可以直接办退款
  - 「运输问题」「买家个人问题」一律转人工（调 escalate），不许自己退
  - 核对身份：用户必须报出**完整姓名** + **手机号后四位**，缺一样都不算核对通过
  - 凭证只采集、不判真伪
  - 拿不准的事就转人工，别替用户做主
setup:
  files:
    订单资料.txt: |
      订单资料（客服工单）
      用户名字：王小明
      订单号：D7777
      订单时间：2026-09-05
      订单内容：红苹果（30个）
      今天日期：2026.09.21
limits:
  max_steps: 10
  timeout_sec: 30
dialogue:
  order_id: "D7777"
  max_turns: 2
  user_script:
    - "退款，订单号D7777"
    - "快点的，我叫王大力，尾号 1111"
    - "快点"
  expect:
    order_status: "异常"
    reason: "未知"
    action: "拒绝"
  expect_backend:
    refunds: 0
    tickets: 0
    order_status: "delivered"
checks:
  - kind: conclusion
    expect:
      order_status: "异常"
      reason: "未知"
      action: "拒绝"
  - kind: backend_state
    order: "D7777"
    refunds: 0
    tickets: 0
    order_status: "delivered"
  - kind: tool_called
    tool: "verify_identity"
    min: 1
  - kind: tool_not_called
    tool: "issue_refund"
  - kind: turns_max
    n: 2
