id: "08_normal_refund"
name: "退款申请 · 正常商家问题（正例）"
category: dialogue
difficulty: normal
instruction: |
  你是电商客服，正在跟一位来电用户对话。你手上有这份工单（见 订单资料.txt）。
  按规定流程处理，处理完调 conclude 交卷。
  
  【作业规范】
  一、能不能退
  - 退款时限：下单后 30 天内，今天的日期见工单
  - 只有「商家问题」（发错货 / 数量不对 / 产品损坏）你可以直接办退款
  - 「运输问题」「买家个人问题」一律转人工（调 escalate），不许自己退
  - 核对身份：用户必须报出**完整姓名** + **手机号后四位**，缺一样都不算核对通过
  - 凭证只采集、不判真伪，凭证也不是办退款的前提
  二、三格结论怎么填
  - 【订单状况】这笔单**本身能不能受理**：
      查得到 + 没退过款 + 没超 30 天 + 身份核对通过 → 正常
      上面任一条不满足                                → 异常
      注意这跟"该不该退"是两件事：用户自己弄坏东西，订单本身是正常的，
      只是不该由你自动退。
  - 【退款原因】商家 / 运输 / 个人 / 未知（判不出来填未知）
  - 【退款情况】分两种，别混：
      客观规则上就不该受理的（身份核对不通过 / 超 30 天 / 订单已退款 / 订单不存在）
          → 填「拒绝」，你自己就能拍这个板
      需要人来判责任或特殊处理的（运输问题 / 买家个人问题 / 拿不准的）
          → 填「提交人工」
  - 处理完（不管是退、拒、还是转人工）**必须调 conclude 交卷**，再调 finish 收尾
setup:
  files:
    订单资料.txt: |
      订单资料（客服工单）
      用户名字：刘晓晓
      订单号：D0238
      订单时间：2026-09-01
      订单内容：高跟鞋（红色，42码）
      今天日期：2026.09.21
limits:
  max_steps: 10
  timeout_sec: 30
dialogue:
  order_id: "D0238"
  max_turns: 10
  user_script:
    - "我一号买的高跟鞋能不能退一下？"
    - "订单号D0238，刘晓晓，尾号 2222"
    - "嗯，你们这边发错了，发的是40码，实在穿不下，我这里有图片。"
    - "（图片）你看，鞋盒上写的就是 40 码，跟订单上的 42 码对不上。"
  expect:
    order_status: "正常"
    reason: "商家"
    action: "允许"
  expect_backend:
    refunds: 1
    tickets: 0
    order_status: "refunded"
checks:
  - kind: conclusion
    expect:
      order_status: "正常"
      reason: "商家"
      action: "允许"
  - kind: backend_state
    order: "D0238"
    refunds: 1
    tickets: 0
    order_status: "refunded"
  - kind: tool_called
    tool: "verify_identity"
    min: 1
  - kind: tool_called
    tool: "issue_refund"
    min: 1
